plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lanone.phototag'
    compileSdk 34

    defaultConfig {
        applicationId "com.lanone.phototag"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// 不引入任何 AndroidX 依赖，纯 framework，构建最不容易炸
dependencies {
}